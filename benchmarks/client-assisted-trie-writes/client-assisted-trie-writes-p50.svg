<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
<title id="title">Client-assisted Trie write p50 latency</title>
<desc id="description">Baseline and warm Trie-path context p50 latency across three collection sizes and zero, one, or two indexes.</desc>
<rect width="1200" height="620" fill="#f5f8fd"/>
<text x="90" y="36" font-size="25" font-weight="700" fill="#0b1f3a">Warm Trie-path context reduces regional write latency</text>
<text x="90" y="61" font-size="14" fill="#526274">Pooled p50 across seven Azure regions and two pristine R2 replicates. Lower is better.</text>
