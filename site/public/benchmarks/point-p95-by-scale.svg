<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="533" viewBox="0 0 1080 533" role="img" aria-labelledby="title desc">
  <title id="title">Cold point-read p95 by collection size</title>
  <desc id="desc">Regional caller latency pooled across seven Azure regions and two replicates. Lower is better.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #1e293b; }
    .title { font-size: 24px; font-weight: 700; }
