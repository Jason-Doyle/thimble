  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="24" y="30" class="title">Cold point-read p95 by collection size</text>
  <text x="24" y="48" class="description">Regional caller latency pooled across seven Azure regions and two replicates. Lower is better.</text>
  <rect x="190" y="76" width="16" height="16" rx="3" fill="#2563eb"/><text x="214" y="89" class="legend">Snapshot</text><rect x="380" y="76" width="16" height="16" rx="3" fill="#0891b2"/><text x="404" y="89" class="legend">Trie</text><rect x="570" y="76" width="16" height="16" rx="3" fill="#7c3aed"/><text x="594" y="89" class="legend">Trie bundle</text>
