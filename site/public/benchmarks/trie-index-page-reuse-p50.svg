<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="590" viewBox="0 0 1050 590" role="img" aria-labelledby="title description">
<title id="title">Trie index page reuse p50 latency</title>
<desc id="description">Control with duplicate index reads and candidate with reused validated pages across collection sizes and index counts.</desc>
<rect width="1050" height="590" fill="#f5f8fd"/>
<text x="90" y="36" font-size="25" font-weight="700" fill="#0b1f3a">Reusing validated index pages reduces every regional p50</text>
<text x="90" y="61" font-size="14" fill="#526274">Pooled p50 across seven Azure regions and two pristine R2 replicates. Lower is better.</text>
<line x1="90" y1="485" x2="1010" y2="485" stroke="#d8e1ee"/><text x="78" y="489" text-anchor="end" font-size="12" fill="#526274">0</text>
