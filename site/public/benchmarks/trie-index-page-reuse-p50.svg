<line x1="90" y1="369.29" x2="1010" y2="369.29" stroke="#d8e1ee"/><text x="78" y="373.29" text-anchor="end" font-size="12" fill="#526274">2,000</text>
<line x1="90" y1="311.43" x2="1010" y2="311.43" stroke="#d8e1ee"/><text x="78" y="315.43" text-anchor="end" font-size="12" fill="#526274">3,000</text>
<line x1="90" y1="253.57" x2="1010" y2="253.57" stroke="#d8e1ee"/><text x="78" y="257.57" text-anchor="end" font-size="12" fill="#526274">4,000</text>
<line x1="90" y1="195.71" x2="1010" y2="195.71" stroke="#d8e1ee"/><text x="78" y="199.71" text-anchor="end" font-size="12" fill="#526274">5,000</text>
<line x1="90" y1="137.86" x2="1010" y2="137.86" stroke="#d8e1ee"/><text x="78" y="141.86" text-anchor="end" font-size="12" fill="#526274">6,000</text>
<line x1="90" y1="80" x2="1010" y2="80" stroke="#d8e1ee"/><text x="78" y="84" text-anchor="end" font-size="12" fill="#526274">7,000</text>
<line x1="90" y1="485" x2="1010" y2="485" stroke="#0b1f3a"/>
<rect x="125.67" y="174.28" width="38" height="310.72" fill="#0b1f3a"/>
