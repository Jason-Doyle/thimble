<rect x="323" y="177.83" width="38" height="307.17" fill="#1677ff"/>
<text x="320" y="520" text-anchor="middle" font-size="14" fill="#0b1f3a">S2</text>
<text x="320" y="541" text-anchor="middle" font-size="12" fill="#526274">-7.91%</text>
<rect x="432.33" y="181.25" width="38" height="303.75" fill="#0b1f3a"/>
<rect x="476.33" y="195.57" width="38" height="289.43" fill="#1677ff"/>
<text x="473.33" y="520" text-anchor="middle" font-size="14" fill="#0b1f3a">M1</text>
