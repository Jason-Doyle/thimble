AWSTemplateFormatVersion: "2010-09-09"
Description: Secondary AWS deployment for the ThimbleDB Node authority.

Parameters:
  ApplicationName:
    Type: String
    Default: thimbledb
  ImageUri:
    Type: String
    Description: ECR image URI built with the AWS Lambda Web Adapter.
  AllowedOrigin:
    Type: String
    Description: Exact browser application origin accepted by the authority.
  Prefix:
    Type: String
    Default: demo
  EntraTenantId:
    Type: String
    Default: ""
  EntraAudience:
    Type: String
    Default: ""
  EntraRequiredScope:
    Type: String
    Default: ""
  EntraRequiredRole:
    Type: String
    Default: ""
  EntraAutoProvision:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  ReadKeyVersions:
    Type: String
    Default: ""
  KeyVersion:
    Type: Number
    Default: 1
    MinValue: 1
  MasterKey:
    Type: String
    NoEcho: true
    Description: Base64-encoded 32-byte deployment master key.
  PasswordPepper:
    Type: String
    NoEcho: true
    Description: Base64-encoded password pepper with at least 32 bytes.

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  AuthBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSessions
            Status: Enabled
            Prefix: auth-v1/sessions/
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: ExpireRateLimits
            Status: Enabled
            Prefix: auth-v1/rate-limits/
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: RemoveExpiredAuthDeleteMarkers
            Status: Enabled
            Prefix: auth-v1/
            ExpiredObjectDeleteMarker: true

  AuthorityRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScopedObjectAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${DataBucket.Arn}/${Prefix}/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${AuthBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub ${Prefix}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt AuthBucket.Arn

  AuthorityFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref ApplicationName
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt AuthorityRole.Arn
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          AWS_LWA_PORT: "8787"
          THIMBLE_HOST: "0.0.0.0"
          THIMBLE_PROVIDER: s3
          S3_BUCKET: !Ref DataBucket
          S3_AUTH_BUCKET: !Ref AuthBucket
          THIMBLE_PREFIX: !Ref Prefix
          THIMBLE_MASTER_KEY: !Ref MasterKey
          THIMBLE_PASSWORD_PEPPER: !Ref PasswordPepper
          THIMBLE_SECURE_COOKIES: "true"
          THIMBLE_ALLOWED_ORIGIN: !Ref AllowedOrigin
          THIMBLE_LOCAL_REGISTRATION: "false"
          THIMBLE_KEY_VERSION: !Ref KeyVersion
          THIMBLE_READ_KEY_VERSIONS: !Ref ReadKeyVersions
          ENTRA_TENANT_ID: !Ref EntraTenantId
          ENTRA_AUDIENCE: !Ref EntraAudience
          ENTRA_REQUIRED_SCOPE: !Ref EntraRequiredScope
          ENTRA_REQUIRED_ROLE: !Ref EntraRequiredRole
          ENTRA_AUTO_PROVISION: !Ref EntraAutoProvision

  AuthorityUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AuthorityFunction
      AuthType: NONE

  AuthorityUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorityFunction
      Principal: "*"
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

Outputs:
  AuthorityUrl:
    Value: !GetAtt AuthorityUrl.FunctionUrl
  BucketName:
    Value: !Ref DataBucket
  AuthBucketName:
    Value: !Ref AuthBucket
