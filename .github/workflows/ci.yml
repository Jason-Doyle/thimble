name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix site ci --no-audit --no-fund
          npm --prefix examples/local-notes ci --no-audit --no-fund
          npm --prefix examples/cloudflare-notes ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Test
        run: |
          npm test
          npm run verify:docs
          npm run examples:check
          npm run benchmark:compare:local

      - name: Build public site
        run: |
          npm run site:build
          npm run site:deploy:check

      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browsers
        run: |
          npm run test:e2e
          npm run site:test

      - name: Build browser, Node, and Worker
        run: npm run build

      - name: Verify package exports
        run: |
          npm run verify:package
          npm run verify:scaffold

      - name: Build container
        run: |
          docker build --provenance=false --tag thimbledb:ci .
          docker run --rm --workdir /app thimbledb:ci node --input-type=module -e "await Promise.all([import('@aws-sdk/client-s3'), import('@azure/storage-blob')])"

      - name: Build AWS Lambda application runtime
        run: |
          docker build --file Dockerfile.aws --target runtime-base --tag thimbledb-aws:ci .
          docker run --rm thimbledb-aws:ci node --input-type=module -e "await import('@aws-sdk/client-s3'); try { await import('@azure/storage-blob'); process.exit(1) } catch (error) { if (error.code !== 'ERR_MODULE_NOT_FOUND') throw error }"

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.3

      - name: Validate Helm chart
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          chart_version="$(awk '$1 == "version:" { print $2 }' deploy/helm/thimbledb/Chart.yaml)"
          app_version="$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }' deploy/helm/thimbledb/Chart.yaml)"
          if [ "${chart_version}" != "${package_version}" ] || [ "${app_version}" != "${package_version}" ]; then
            echo "Chart version ${chart_version}/${app_version} does not match package version ${package_version}."
            exit 1
          fi
          helm lint deploy/helm/thimbledb --values deploy/helm/test/values.yaml
          helm template thimbledb deploy/helm/thimbledb --namespace thimbledb --values deploy/helm/test/values.yaml > /tmp/thimbledb-rendered.yaml

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: thimbledb
          version: v0.33.0
          kubectl_version: v1.37.0
          wait: 180s

      - name: Load Kubernetes smoke image
        run: |
          kind load docker-image --name thimbledb thimbledb:ci

      - name: Deploy Helm chart to kind
        shell: bash
        run: |
          kubectl create namespace thimbledb
          kubectl --namespace thimbledb create configmap thimbledb-test-oidc \
            --from-file=server.mjs=deploy/helm/test/oidc-server.mjs
          kubectl apply --filename deploy/helm/test/oidc.yaml
          master_key="$(node -e "console.log(Buffer.alloc(32, 7).toString('base64'))")"
          kubectl --namespace thimbledb create secret generic thimbledb-secrets \
            --from-literal=THIMBLE_MASTER_KEY="${master_key}"
          helm upgrade --install thimbledb deploy/helm/thimbledb \
            --namespace thimbledb \
            --values deploy/helm/test/values.yaml \
            --wait \
            --timeout 5m
          kubectl --namespace thimbledb rollout status deployment/thimbledb-test-oidc --timeout=2m

      - name: Test Kubernetes deployment
        run: node scripts/verify-kubernetes.mjs
