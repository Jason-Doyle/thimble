name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix site ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build public site
        run: npm run site:build

      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browsers
        run: |
          npm run test:e2e
          npm run site:test

      - name: Build browser, Node, and Worker
        run: npm run build

      - name: Verify package exports
        run: npm run verify:package

      - name: Build container
        run: |
          docker build --tag thimbledb:ci .
          docker run --rm thimbledb:ci node --input-type=module -e "await Promise.all([import('@aws-sdk/client-s3'), import('@azure/storage-blob')])"

      - name: Build AWS Lambda container
        run: |
          docker build --file Dockerfile.aws --tag thimbledb-aws:ci .
          docker run --rm thimbledb-aws:ci node --input-type=module -e "await import('@aws-sdk/client-s3'); try { await import('@azure/storage-blob'); process.exit(1) } catch (error) { if (error.code !== 'ERR_MODULE_NOT_FOUND') throw error }"
